version: "3"

services:
  nginx:
    image: nginx:1.19.4
    depends_on:
      - asl-frontend
      - asl-backend
    volumes:
      - ./certbot/www/:/var/www/certbot:ro
      - ./prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 80:80
      - 443:443
    certbot:
      image: certbot/certbot:latest
      volumes:
        - ./certbot/www/:/var/www/certbot/:rw
        - ./certbot/conf/:/etc/letsencrypt/:rw
  asl-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=5000

  asl-frontend:
    build:
      context: ./frontend
      dockerfile: DockerfileProd
    environment:
      - PORT=80
