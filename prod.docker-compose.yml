version: "3"

services:
  nginx:
    image: nginx:1.19.4
    depends_on:
      - asl-frontend
      - asl-backend
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
  asl-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=5000

  asl-frontend:
    build:
      context: ./frontend
      dockerfile: DockerfileProd
    environment:
      - PORT=80
